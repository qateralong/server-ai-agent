The\ provider\ is\ global\ for\ the\ whole\ agent.\ Each\ provider\ has\ its\ own\ key,\ model\ and\ endpoint\ --\ switching\ does\ not\ lose\ the\ others.\ A\ request\ already\ in\ progress\ finishes\ on\ the\ old\ provider;\ the\ next\ one\ goes\ to\ the\ selected\ one.=Провайдер один на весь агент. У каждого свой ключ, модель и endpoint — переключение не теряет остальные. Уже идущий запрос доводится на прежнем провайдере, следующий уходит на выбранный.
