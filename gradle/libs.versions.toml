[versions]
java          = "25"
javafx        = "27"
javafxPlugin  = "0.1.0"
atlantafx     = "2.1.0"
jackson       = "2.22.2"
jacksonAnnotations = "2.22"
anthropic      = "2.34.0"
nightconfig   = "3.9.0"
slf4j         = "2.0.19"
logback       = "1.5.38"
junit         = "6.1.3"
sqlite        = "3.53.4.0"
javawebsocket = "1.6.0"

[libraries]
jackson-databind  = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
anthropic-java   = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }

nightconfig-core = { module = "com.electronwill.night-config:core", version.ref = "nightconfig" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightconfig" }

sqlite-jdbc      = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

java-websocket   = { module = "org.java-websocket:Java-WebSocket", version.ref = "javawebsocket" }

slf4j-api        = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic  = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

atlantafx-base   = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }

junit-jupiter    = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafxPlugin" }
